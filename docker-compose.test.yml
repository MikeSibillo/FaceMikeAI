# Optional: start Postgres for running voice tests
# docker compose -f docker-compose.test.yml up -d
# export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/ai_aztec_test"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_aztec_test
    ports:
      - "5432:5432"
